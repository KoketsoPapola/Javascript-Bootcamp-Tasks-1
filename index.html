<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Bootcamp Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>JavaScript Bootcamp Tasks</h1>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- TASK 1 -->
        <div class="task-box">
            <h2>Task 1: Add Numbers</h2>

            <input type="number" id="num1" placeholder="Enter number 1">
            <input type="number" id="num2" placeholder="Enter number 2">

            <button onclick="addNumbers()">Calculate</button>

            <div class="output" id="result"></div>
        </div>

        <!-- TASK 2 -->
        <div class="task-box">
            <h2>Task 2: Multiply Numbers</h2>

            <input type="number" id="a" placeholder="Enter number 1">
            <input type="number" id="b" placeholder="Enter number 2">

            <button onclick="multiplyNumbers()">Multiply</button>

            <div class="output" id="result2"></div>
        </div>

        <!-- TASK 3 -->
        <div class="task-box">
            <h2>Task 3: Check Even or Odd</h2>

            <input type="number" id="num" placeholder="Enter a number">

            <button onclick="checkEvenOdd()">Check</button>

            <div class="output" id="result3"></div>
        </div>

    </div>

    <!-- JAVASCRIPT FILE -->
    <script src="script.js"></script>

</body>
</html>
